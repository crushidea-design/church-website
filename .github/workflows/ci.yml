name: CI

on:
  push:
    branches: [main, codex/work]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref so only the latest push counts.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Setup Java for security rules tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Security rules and comment transaction tests
        run: npx --yes --package firebase-tools@15.25.1 firebase emulators:exec --config firebase.emulators.json --project demo-church-review --only firestore,storage "npx vitest run tests/security.rules.test.ts"
